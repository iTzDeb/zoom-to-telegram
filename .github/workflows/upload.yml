name: Zoom to Telegram Pipeline
on:
  repository_dispatch:
    types: [zoom_recording_ready]
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'Meeting Title (e.g., 2026-09-20 11.00.00 TCR CLAT)'
        required: true
      download_url:
        description: 'Direct MP4 Download URL'
        required: true

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Added to prevent premature termination of large uploads
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Network Packages
        run: npm install telegram axios

      - name: Install FFmpeg for Metadata Fix
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Execute Cloud Uploader
        env:
          # This fallback logic allows BOTH automated webhooks and manual inputs to work
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url || github.event.inputs.download_url }}
          FOLDER_NAME: ${{ github.event.client_payload.folder_name || github.event.inputs.folder_name }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: node uploader.js
