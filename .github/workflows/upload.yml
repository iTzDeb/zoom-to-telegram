name: Zoom to Telegram Pipeline
on:
  repository_dispatch:
    types: [zoom_recording_ready]

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Network & Telegram Packages
        run: npm install telegram axios

      - name: Execute Cloud Uploader
        env:
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
          FOLDER_NAME: ${{ github.event.client_payload.folder_name }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: node uploader.js
